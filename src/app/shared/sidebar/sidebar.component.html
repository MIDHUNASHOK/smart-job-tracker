<aside
  class="sidebar"
  [class.collapsed]="collapsed"
  [class.mobile-open]="mobileOpen"
>

  <!-- ==================================================
       BRAND
  =================================================== -->

  <div class="sidebar-brand">

    <a
      routerLink="/dashboard"
      class="brand-link"
      aria-label="Go to NextZiel dashboard"
    >

      <!-- COLLAPSED LOGO -->
      <img
        *ngIf="collapsed"
        src="assets/global_Icon/next_icon.png"
        alt="NextZiel"
        class="brand-icon"
      >

      <!-- EXPANDED LOGO -->
      <img
        *ngIf="!collapsed"
        src="assets/global logo/nextlogo_wb_cropped.png"
        alt="NextZiel Logo"
        class="brand-logo"
      >

    </a>

  </div>

  <!-- ==================================================
       NAVIGATION
  =================================================== -->

  <nav class="sidebar-navigation">

    <!-- WORKSPACE LABEL -->
    <p
      class="menu-label"
      *ngIf="!collapsed"
    >
      Workspace
    </p>

    <ul class="menu">

      <!-- DASHBOARD -->
      <li class="menu-item">

        <a
          routerLink="/dashboard"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="menu-link"
          [attr.title]="collapsed ? 'Dashboard' : null"
        >

          <span class="menu-icon">
            <i class="bi bi-grid"></i>
          </span>

          <span
            class="menu-text"
            *ngIf="!collapsed"
          >
            Dashboard
          </span>

        </a>

      </li>

      <!-- JOBS -->
      <li class="menu-item">

        <a
          routerLink="/jobs/jobslist"
          routerLinkActive="active"
          class="menu-link"
          [attr.title]="collapsed ? 'Jobs' : null"
        >

          <span class="menu-icon">
            <i class="bi bi-briefcase"></i>
          </span>

          <span
            class="menu-text"
            *ngIf="!collapsed"
          >
            Jobs
          </span>

        </a>

      </li>

      <!-- CV ANALYTICS -->
      <li class="menu-item">

        <a
          routerLink="/analytics"
          routerLinkActive="active"
          class="menu-link"
          [attr.title]="collapsed ? 'CV Analytics' : null"
        >

          <span class="menu-icon">
            <i class="bi bi-bar-chart-line"></i>
          </span>

          <span
            class="menu-text"
            *ngIf="!collapsed"
          >
            CV Analytics
          </span>

        </a>

      </li>

      <!-- PROFILE -->
      <li class="menu-item">

        <a
          routerLink="/profile"
          routerLinkActive="active"
          class="menu-link"
          [attr.title]="collapsed ? 'Profile' : null"
        >

          <span class="menu-icon">
            <i class="bi bi-person"></i>
          </span>

          <span
            class="menu-text"
            *ngIf="!collapsed"
          >
            Profile
          </span>

        </a>

      </li>

      <!-- SMART APPLY -->
      <!-- <li class="menu-item">

        <a
          routerLink="/smart_apply"
          routerLinkActive="active"
          class="menu-link"
          [attr.title]="collapsed ? 'Smart Apply' : null"
        >

          <span class="menu-icon">
            <i class="bi bi-stars"></i>
          </span>

          <span
            class="menu-text"
            *ngIf="!collapsed"
          >
            Smart Apply
          </span>

          <span
            class="smart-badge"
            *ngIf="!collapsed"
          >
            AI
          </span>

        </a>

      </li> -->

    </ul>

    <!-- ==================================================
         SUPPORT
    =================================================== -->

    <div class="support-section">

      <p
        class="menu-label"
        *ngIf="!collapsed"
      >
        Support
      </p>

      <ul class="menu">

        <li class="menu-item">

          <button
            type="button"
            class="menu-link documentation-link"
            (click)="openDocumentation()"
            [attr.title]="
              collapsed
                ? 'Help & Documentation'
                : null
            "
          >

            <span class="menu-icon">
              <i class="bi bi-question-circle"></i>
            </span>

            <span
              class="menu-text"
              *ngIf="!collapsed"
            >
              Help & Documentation
            </span>

            <i
              *ngIf="!collapsed"
              class="bi bi-box-arrow-up-right external-icon"
            ></i>

          </button>

        </li>

      </ul>

    </div>

  </nav>

  <!-- ==================================================
       FOOTER
  =================================================== -->

  <div
    class="sidebar-footer"
    *ngIf="!collapsed"
  >

    <div class="footer-icon">
      <i class="bi bi-bullseye"></i>
    </div>

    <div class="footer-content">

      <strong>
        Track. Analyze. Achieve.
      </strong>

      <span>
        Your career, organized.
      </span>

    </div>

  </div>

</aside>
