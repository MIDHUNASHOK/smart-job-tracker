<nav class="navbar navbar-custom">

  <!-- ==================================================
       LEFT SIDE
  =================================================== -->

  <div class="navbar-left">

    <button
      type="button"
      class="navbar-icon-btn menu-btn"
      aria-label="Toggle sidebar"
      title="Toggle sidebar"
      (click)="toggleSidebar.emit()"
    >

      <i class="bi bi-list"></i>

    </button>

  </div>

  <!-- ==================================================
       RIGHT SIDE
  =================================================== -->

  <div class="navbar-right">

    <!-- NOTIFICATIONS -->
    <div class="dropdown">

      <button
        type="button"
        class="navbar-icon-btn notification-btn"
        aria-label="Open notifications"
        data-bs-toggle="dropdown"
        aria-expanded="false"
      >

        <i class="bi bi-bell"></i>

        <span class="notification-badge">
          3
        </span>

      </button>

      <div class="dropdown-menu dropdown-menu-end notification-menu">

        <div class="dropdown-title-row">

          <div>

            <h6>
              Notifications
            </h6>

            <p>
              Your latest updates
            </p>

          </div>

          <span class="notification-count">
            3 new
          </span>

        </div>

        <div class="dropdown-divider"></div>

        <button
          type="button"
          class="notification-item"
        >

          <div class="notification-icon interview-icon">

            <i class="bi bi-calendar-check"></i>

          </div>

          <div class="notification-content">

            <strong>
              Interview scheduled
            </strong>

            <span>
              Your upcoming interview has been added.
            </span>

            <small>
              Just now
            </small>

          </div>

        </button>

        <button
          type="button"
          class="notification-item"
        >

          <div class="notification-icon application-icon">

            <i class="bi bi-briefcase"></i>

          </div>

          <div class="notification-content">

            <strong>
              Application updated
            </strong>

            <span>
              One of your job statuses has changed.
            </span>

            <small>
              1 hour ago
            </small>

          </div>

        </button>

        <button
          type="button"
          class="notification-item"
        >

          <div class="notification-icon profile-icon">

            <i class="bi bi-person-check"></i>

          </div>

          <div class="notification-content">

            <strong>
              Complete your profile
            </strong>

            <span>
              Add more details to improve your profile.
            </span>

            <small>
              Today
            </small>

          </div>

        </button>

        <div class="dropdown-divider"></div>

        <button
          type="button"
          class="view-notifications-btn"
        >
          View all notifications
          <i class="bi bi-arrow-right"></i>
        </button>

      </div>

    </div>

    <!-- PROFILE -->
    <div class="dropdown">

      <button
        type="button"
        class="profile-trigger"
        data-bs-toggle="dropdown"
        aria-expanded="false"
      >

        <div class="avatar">
          {{ userInitial }}
        </div>

        <div class="profile-summary d-none d-md-flex">

          <span class="profile-name">
            {{ userName }}
          </span>

          <span class="profile-role">
            NextZiel account
          </span>

        </div>

        <i class="bi bi-chevron-down profile-chevron"></i>

      </button>

      <div class="dropdown-menu dropdown-menu-end profile-menu">

        <div class="profile-menu-header">

          <div class="avatar menu-avatar">
            {{ userInitial }}
          </div>

          <div>

            <strong>
              {{ userName }}
            </strong>

            <span>
              Manage your account
            </span>

          </div>

        </div>

        <div class="dropdown-divider"></div>

        <a
          routerLink="/profile"
          class="profile-menu-item"
        >

          <span class="profile-menu-icon">

            <i class="bi bi-person"></i>

          </span>

          <div>

            <strong>
              Profile
            </strong>

            <small>
              Update your personal information
            </small>

          </div>

        </a>

        <a
          routerLink="/settings"
          class="profile-menu-item"
        >

          <span class="profile-menu-icon">

            <i class="bi bi-gear"></i>

          </span>

          <div>

            <strong>
              Settings
            </strong>

            <small>
              Manage preferences and security
            </small>

          </div>

        </a>

        <div class="dropdown-divider"></div>

        <button
          type="button"
          class="profile-menu-item logout-item"
          (click)="logout()"
        >

          <span class="profile-menu-icon">

            <i class="bi bi-box-arrow-right"></i>

          </span>

          <div>

            <strong>
              Logout
            </strong>

            <small>
              Sign out of your account
            </small>

          </div>

        </button>

      </div>

    </div>

  </div>

</nav>
