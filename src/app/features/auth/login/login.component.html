<div class="login-container">

  <div class="login-card">

    <div class="logo">
      Smart Job Tracker
    </div>

    <p class="subtitle">
      Track your applications professionally
    </p>

    <form
      [formGroup]="loginForm"
      (ngSubmit)="onLogin()"
    >

      <!-- EMAIL -->

      <mat-form-field
        appearance="outline"
        class="full-width"
      >

        <mat-label>Email Address</mat-label>

        <input
          matInput
          type="email"
          formControlName="email"
        >

      </mat-form-field>

      <!-- PASSWORD -->

      <mat-form-field
        appearance="outline"
        class="full-width"
      >

        <mat-label>Password</mat-label>

        <input
          matInput
          type="password"
          formControlName="password"
        >

      </mat-form-field>

      <!-- OPTIONS -->

      <div class="login-options">

        <mat-checkbox>
          Remember me
        </mat-checkbox>

        <a href="#">
          Forgot Password?
        </a>

      </div>

      <!-- LOGIN BUTTON -->

      <button
        mat-raised-button
        color="primary"
        class="login-btn"
        type="submit"
      >

        {{ isLoading ? 'Loading...' : 'Login' }}

      </button>

    </form>

    <!-- DIVIDER -->

    <!-- <div class="divider">
      OR
    </div> -->

    <!-- GOOGLE BUTTON -->

    <!-- <button
      mat-stroked-button
      class="google-btn"
    >
      Continue with Google
    </button> -->

    <!-- REGISTER -->

    <div class="register-link">

      Don't have an account?

      <a routerLink="/register">
        Register
      </a>

    </div>

  </div>

</div>
