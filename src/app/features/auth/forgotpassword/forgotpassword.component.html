<div class="forgot-page">

  <div class="forgot-card">

    <!-- LOGO -->
    <div class="logo-section">

      <img
        src="assets/global logo/nextlogo.png"
        alt="NextZiel Logo"
        class="logo-img"
      >

    </div>

    <!-- ICON -->
    <div class="reset-icon">

      <i class="bi bi-key"></i>

    </div>

    <!-- HEADER -->
    <div class="form-header">

      <h2>Forgot your password?</h2>

      <p class="subtitle">
        Enter your registered email address and we’ll send you a password reset link.
      </p>

    </div>

    <!-- FORM -->
    <form
      [formGroup]="forgotForm"
      (ngSubmit)="onSubmit()"
    >

      <div class="form-group">

        <label for="email">
          Email address
        </label>

        <div class="input-wrapper">

          <i class="bi bi-envelope input-icon"></i>

          <input
            id="email"
            type="email"
            class="form-control custom-input"
            formControlName="email"
            placeholder="Enter your registered email"
            autocomplete="email"
          >

        </div>

        <small
          class="validation-message"
          *ngIf="
            forgotForm.get('email')?.touched &&
            forgotForm.get('email')?.hasError('required')
          "
        >
          Email address is required.
        </small>

        <small
          class="validation-message"
          *ngIf="
            forgotForm.get('email')?.touched &&
            forgotForm.get('email')?.hasError('email')
          "
        >
          Please enter a valid email address.
        </small>

      </div>

      <button
        type="submit"
        class="btn reset-btn"
        [disabled]="isLoading || forgotForm.invalid"
      >

        <span *ngIf="!isLoading">
          Send reset link
          <i class="bi bi-arrow-right"></i>
        </span>

        <span
          *ngIf="isLoading"
          class="loading-content"
        >
          <span class="spinner-border spinner-border-sm"></span>
          Sending...
        </span>

      </button>

    </form>

    <!-- BACK TO LOGIN -->
    <div class="login-link">

      <span>Remember your password?</span>

      <a routerLink="/login">
        Back to login
      </a>

    </div>

    <!-- SECURITY NOTE -->
    <div class="security-note">

      <i class="bi bi-shield-check"></i>

      <span>
        We’ll only send a reset link if the email belongs to an existing account.
      </span>

    </div>

  </div>

</div>
