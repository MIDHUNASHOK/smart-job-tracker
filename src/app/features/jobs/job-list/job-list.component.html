


<div class="container py-1">

    <!-- Top Header -->
    <div class="d-flex justify-content-between align-items-center mb-0">
  
      <div>
        <h2 class="fw-bold dashboard-title mb-1">
          Job Applications
        </h2>
  
        <p class="text-muted mb-0">
          Track and manage your applications
        </p>
      </div>
  
      <!-- <button
        class="btn add-job-btn"
        data-bs-toggle="modal"
        data-bs-target="#addJobModal"
      >
        + Add Job
      </button> -->
  
    </div>
  
    <!-- Filters -->
    <div class="card custom-card border-0 mb-4">
  
      <div class="card-body p-4">
  
        <div class="row g-3">
  
          <!-- Search -->
          <div class="col-lg-4">
  
            <div class="search-box">
  
              <i class="bi bi-search search-icon"></i>
  
              <input
                type="text"
                class="form-control custom-input ps-5"
                placeholder="Search jobs..."
              />
  
            </div>
  
          </div>
  
          <!-- Status Filter -->
          <div class="col-lg-4">
  
            <select class="form-select custom-input">
              <option>All Status</option>
              <option>Applied</option>
              <option>Interview</option>
              <option>Rejected</option>
              <option>Offer Received</option>
            </select>
  
          </div>
  
          <!-- Company Filter -->
          <div class="col-lg-4">
  
            <select class="form-select custom-input">
              <option>All Companies</option>
              <option>Google</option>
              <option>Amazon</option>
              <option>Microsoft</option>
            </select>
  
          </div>
  
        </div>
  
      </div>
  
    </div>
  
    <!-- Job Table -->
    <div class="card custom-card border-0">
  
      <div class="table-responsive">
  
        <table class="table align-middle mb-0 custom-table">
  
          <thead>
  
            <tr>
              <th>Company</th>
              <th>Role</th>
              <th>Status</th>
              <th>Applied Date</th>
              <th class="text-center">Action</th>
            </tr>
  
          </thead>
  
          <tbody>
  
            <!-- Row -->
            <tr>
  
              <td class="fw-semibold">Google</td>
  
              <td>Front End Developer</td>
  
              <td>
                <span class="status-badge interview-badge">
                  Interview
                </span>
              </td>
  
              <td>May 12, 2024</td>
  
              <td>
  
                <div class="d-flex justify-content-center gap-3">
  
                  <button class="action-btn edit-btn">
                    <i class="bi bi-pencil"></i>
                  </button>
  
                  <button class="action-btn delete-btn">
                    <i class="bi bi-trash"></i>
                  </button>
  
                </div>
  
              </td>
  
            </tr>
  
            <!-- Row -->
            <tr>
  
              <td class="fw-semibold">Microsoft</td>
  
              <td>Software Engineer</td>
  
              <td>
                <span class="status-badge applied-badge">
                  Applied
                </span>
              </td>
  
              <td>May 10, 2024</td>
  
              <td>
  
                <div class="d-flex justify-content-center gap-3">
  
                  <button class="action-btn edit-btn">
                    <i class="bi bi-pencil"></i>
                  </button>
  
                  <button class="action-btn delete-btn">
                    <i class="bi bi-trash"></i>
                  </button>
  
                </div>
  
              </td>
  
            </tr>
  
            <!-- Row -->
            <tr>
  
              <td class="fw-semibold">Amazon</td>
  
              <td>SDE Intern</td>
  
              <td>
                <span class="status-badge rejected-badge">
                  Rejected
                </span>
              </td>
  
              <td>May 08, 2024</td>
  
              <td>
  
                <div class="d-flex justify-content-center gap-3">
  
                  <button class="action-btn edit-btn">
                    <i class="bi bi-pencil"></i>
                  </button>
  
                  <button class="action-btn delete-btn">
                    <i class="bi bi-trash"></i>
                  </button>
  
                </div>
  
              </td>
  
            </tr>
  
          </tbody>
  
        </table>
  
      </div>
  
      <!-- Pagination -->
      <div class="d-flex justify-content-center align-items-center p-4 gap-2">
  
        <button class="pagination-btn">
          <i class="bi bi-chevron-left"></i>
        </button>
  
        <button class="pagination-btn active-page">
          1
        </button>
  
        <button class="pagination-btn">
          2
        </button>
  
        <button class="pagination-btn">
          3
        </button>
  
        <button class="pagination-btn">
          <i class="bi bi-chevron-right"></i>
        </button>
  
      </div>
  
    </div>
  
  </div>
